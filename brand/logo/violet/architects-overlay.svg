<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Architects Overlay — Emblem "Overarch", Drake colorway. Transparenter Hintergrund. -->
  <!-- Colorways via Hex-Swap: RING/STRUCT (Gelb), ACCENT/HAZARD (Rot), CUBE_SIDE (dunkler Rot-Ton) -->
  <defs>
    <clipPath id="legL">
      <polygon points="234,112 258,134 132,402 60,402"/>
    </clipPath>
    <clipPath id="legR">
      <polygon points="278,112 254,134 392,402 452,402"/>
    </clipPath>
    <pattern id="hazard" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#9b5cff"/>
      <rect width="9" height="18" fill="#ff5ca8"/>
    </pattern>
  </defs>

  <!-- Overlay-Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#9b5cff" stroke-width="6"/>

  <!-- Blueprint-Raster (dezent, nur im Ring) -->
  <g stroke="#ff5ca8" stroke-width="1" opacity="0.28" clip-path="url(#ringClip)">
    <path d="M86 196h340M86 256h340M86 316h340M196 86v340M256 86v340M316 86v340"/>
  </g>
  <defs>
    <clipPath id="ringClip"><circle cx="256" cy="256" r="167"/></clipPath>
  </defs>

  <!-- A-Schenkel (Träger) -->
  <g>
    <polygon points="234,112 258,134 132,402 60,402" fill="#9b5cff" stroke="#ff5ca8" stroke-width="3"/>
    <polygon points="278,112 254,134 392,402 452,402" fill="#9b5cff" stroke="#ff5ca8" stroke-width="3"/>
    <!-- Trägerstreben -->
    <g stroke="#ff5ca8" stroke-width="3">
      <line x1="204" y1="168" x2="240" y2="168"/>
      <line x1="176" y1="222" x2="216" y2="222"/>
      <line x1="148" y1="276" x2="190" y2="276"/>
      <line x1="120" y1="330" x2="164" y2="330"/>
      <line x1="308" y1="168" x2="272" y2="168"/>
      <line x1="336" y1="222" x2="296" y2="222"/>
      <line x1="364" y1="276" x2="322" y2="276"/>
      <line x1="392" y1="330" x2="348" y2="330"/>
    </g>
    <!-- Füße: Hazard-Stripes -->
    <g clip-path="url(#legL)">
      <rect x="52" y="340" width="130" height="64" fill="url(#hazard)" stroke="#ff5ca8" stroke-width="2"/>
    </g>
    <g clip-path="url(#legR)">
      <rect x="330" y="340" width="130" height="64" fill="url(#hazard)" stroke="#ff5ca8" stroke-width="2"/>
    </g>
  </g>

  <!-- Fracht-Würfel (Querstrich des A) -->
  <g stroke="#9b5cff" stroke-width="3" stroke-linejoin="round">
    <polygon points="256,196 334,240 256,284 178,240" fill="#ff5ca8"/>
    <polygon points="178,240 256,284 256,368 178,324" fill="#6d3fd1"/>
    <polygon points="334,240 256,284 256,368 334,324" fill="#6d3fd1"/>
    <!-- X auf der Deckfläche -->
    <g fill="none" stroke="#9b5cff" stroke-width="3">
      <line x1="214" y1="224" x2="298" y2="256"/>
      <line x1="298" y1="224" x2="214" y2="256"/>
    </g>
  </g>

  <!-- Handelsroute (Zickzack, symmetrisch) -->
  <polyline points="150,436 200,408 256,436 312,408 362,436" fill="none" stroke="#9b5cff" stroke-width="4"/>
  <g fill="#ff5ca8" stroke="#9b5cff" stroke-width="2">
    <polygon points="150,427 159,436 150,445 141,436"/>
    <polygon points="200,399 209,408 200,417 191,408"/>
    <polygon points="256,427 265,436 256,445 247,436"/>
    <polygon points="312,399 321,408 312,417 303,408"/>
    <polygon points="362,427 371,436 362,445 353,436"/>
  </g>
</svg>
