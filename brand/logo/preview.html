:root{--bg:#14161a;--fg:#e8e6e1;--dim:#9a9891;--amber:#e8a33d;--line:#2a2e36;--card:#1b1e24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui;padding:24px}
h1{font-size:20px;color:var(--fg);margin-bottom:2px}
h1 b{color:var(--amber)}
.sub{color:var(--dim);margin-bottom:16px;font-size:13px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.row .name{width:130px;color:var(--amber);font-weight:600}
.row svg{width:72px;height:72px}
.demo{display:flex;gap:6px}
.demo div{display:flex;align-items:center;justify-content:center;border-radius:6px}
.l{background:#e8e6e1;width:84px;height:72px}
.d{background:#14161a;width:84px;height:72px}
.hz{background:repeating-linear-gradient(45deg,#14161a 0 6px,#1d222a 6px 12px);width:84px;height:72px}
