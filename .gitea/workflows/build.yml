# Gitea Actions — Build & Release
#
# Trigger:
#   push auf main  -> Linux-Bundle als CI-Artifact (Sanity)
#   Tag v*         -> Linux- + Windows-Bundle, angehängt an die Gitea-Release
#   daily schedule -> Full-Run inkl. Mirror-Cleanup (Stale-Branches auf dem
#                     öffentlichen GitHub-Repo werden regelmäßig entfernt)
#
# Runner-Labels:
#   Linux   -> ubuntu-latest       (Docker-Runner; Tauri-Systemdeps werden im
#                                   Job selbst installiert, kein Image-Wissen)
#   Windows -> windows-selfhosted  (Sebos Windows-PC; eigene Label, damit der
#                                   Job NICHT rot schlägt, solange kein
#                                   Windows-Runner registriert ist — er wartet
#                                   einfach in der Queue. Einrichtung:
#                                   docs/CI-WINDOWS.md)
#
# Gitea-act_runner-Kompatibilität (bewusst minimierter Action-Footprint):
#   Verwendet werden NUR actions/checkout@v4 + actions/upload-artifact@v3
#   (Standard-Set, das act_runner über sein GitHub-Host-Mapping bezieht).
#   Kein setup-node/setup-pnpm, kein dtolnay/rust-toolchain, kein
#   tauri-apps/tauri-action: Toolchain kommt per Plain Shell (gepinnte
#   Versionen), `tauri build` wird direkt aufgerufen.
#   Keine Secrets in dieser Datei; ausschließlich der von Gitea bereitgestellte
#   GITHUB_TOKEN (repo-scoped) für das Release-Upload an die Gitea-API.

name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Deterministischer Mirror-Cleanup: der Stale-Cleanup in mirror-public
  # läuft sonst nur bei Push auf main/v*-Tag — direkte Branch-Pushes an das
  # GitHub-Repo (oder Altlasten) blieben bis zum nächsten main-Trigger
  # stehen. Der tägliche Lauf spiegt main+Tags neu und löscht alles andere
  # auf dem öffentlichen Repo (self-healing).
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

jobs:
  linux:
    name: Linux (ubuntu-latest) — deb/AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System-Builddeps (Tauri v2 Linux)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl wget file jq pkg-config \
            libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Node 22 + pnpm (gepinnt)
        run: |
          set -euo pipefail
          curl -fsSLO https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz
          tar -xJf node-v22.23.4-linux-x64.tar.xz -C /opt
          rm node-v22.23.4-linux-x64.tar.xz
          echo "/opt/node-v22.23.4-linux-x64/bin" >> "$GITHUB_PATH"
          /opt/node-v22.23.4-linux-x64/bin/npm install -g pnpm@12.14.0

      - name: Rust-Toolchain (gepinnt, MSRV ist 1.90)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Toolchain-Versionen anzeigen
        run: |
          node -v
          pnpm -v
          rustc -V
          cargo -V

      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile

      - name: Frontend bauen (vite → ./build)
        run: pnpm build

      - name: Tauri-Bundle bauen (deb + AppImage)
        run: pnpm tauri build

      - name: Artefakte hochladen (CI-Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: linux-bundle
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Gitea-Release an Tag (v*) befüllen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          INSTANCE="${GITHUB_SERVER_URL:-https://git.sebo-home.de}"
          API="${INSTANCE}/api/v1"
          AUTH="Authorization: token ${GITHUB_TOKEN}"

          # Release zum Tag suchen; fehlt es, anlegen.
          ID="$(curl -sS -H "$AUTH" \
            "$API/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "${ID}" ]; then
            ID="$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Architects Overlay ${TAG}\",\"body\":\"Automatischer CI-Build.\"}" \
              "$API/repos/${GITHUB_REPOSITORY}/releases" | jq -r '.id')"
          fi

          # Assets anhängen (existierende Dateien; Duplikat-Upload = warnen,
          # z. B. bei Re-Tag gleicher Version — Artefakte liegen eh im Run).
          # Plus SHA256SUMS-Sidecar (UC t_d323be7e): der Updater im Overlay
          # verifiziert JEKEN Download gegen diese Prüfsumme, bevor er
          # installiert (kein Trust-on-Download ohne Check).
          for f in target/release/bundle/deb/*.deb \
                   target/release/bundle/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            hash="$(sha256sum "$f" | cut -d' ' -f1)"
            echo "$hash  $(basename "$f")" >> SHA256SUMS
            if ! curl -fsS -X POST -H "$AUTH" -F "attachment=@${f}" \
              "$API/repos/${GITHUB_REPOSITORY}/releases/${ID}/assets" >/dev/null; then
              echo "WARN: Asset-Upload fehlgeschlagen (übersprungen): ${f}"
            else
              echo "Release-Asset: ${f}"
            fi
          done
          if [ -s SHA256SUMS ]; then
            if curl -fsS -X POST -H "$AUTH" -F "attachment=@SHA256SUMS" \
              "$API/repos/${GITHUB_REPOSITORY}/releases/${ID}/assets" >/dev/null; then
              echo "Release-Asset: SHA256SUMS"
            else
              echo "WARN: SHA256SUMS-Upload fehlgeschlagen — ohne Prüfsumme lehnt der Updater den Download ab."
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows (windows-selfhosted) — NSIS/MSI
    # Windows-Build seit 2026-10 aktiv: windows-selfhosted Runner (Sebo,
    # Windows-VM auf server-hermes, Label windows-selfhosted).
    runs-on: windows-selfhosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PC-Prereqs prüfen (Node, npm, Rust MSVC)
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v
          rustc -V
          cargo -V

      - name: pnpm installieren (gepinnt)
        shell: bash
        run: |
          npm install -g pnpm@12.14.0
          # GITHUB_PATH wirkt unter act_runner 0.2.13 auch für PowerShell-
          # Steps (belegt: Run 208 kam bis zum Tauri-Build):
          echo "$(npm config get prefix)" >> "$GITHUB_PATH"

      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile

      - name: Frontend bauen (vite → ./build)
        run: pnpm build

      - name: Tauri-Bundle bauen (NSIS — MSI wartet auf WiX-Fix in der VM)
        run: pnpm tauri build --bundles nsis

      - name: Artefakte hochladen (CI-Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: windows-bundle
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Gitea-Release an Tag (v*) befüllen (Windows-Assets)
        if: startsWith(github.ref, 'refs/tags/v')
        # PowerShell statt Bash: Git-Bash auf Windows hat kein jq. curl.exe
        # (Win10+) übernimmt den Multipart-Upload.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $TAG = $env:GITHUB_REF_NAME
          $instance = if ($env:GITHUB_SERVER_URL) { $env:GITHUB_SERVER_URL } else { 'https://git.sebo-home.de' }
          $api = "$instance/api/v1"
          $headers = @{ Authorization = "token $env:GITHUB_TOKEN" }

          # Release zum Tag suchen; fehlt es (z. B. Windows-Job schneller als der
          # Linux-Job), selbst anlegen — sonst fehlen hier die Assets.
          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "$api/repos/$env:GITHUB_REPOSITORY/releases/tags/$TAG" -Headers $headers
          } catch { $release = $null }
          if (-not $release -or -not $release.id) {
            try {
              $body = @{ tag_name = $TAG; name = "Architects Overlay $TAG"; body = 'Automatischer CI-Build.' } | ConvertTo-Json
              $release = Invoke-RestMethod -Method Post -Uri "$api/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -ContentType 'application/json' -Body $body
            } catch {
              # Race: der Linux-Job kann das Release dazwischen angelegt haben.
              $release = Invoke-RestMethod -Uri "$api/repos/$env:GITHUB_REPOSITORY/releases/tags/$TAG" -Headers $headers
            }
          }

          $files = Get-ChildItem -Path 'target\release\bundle\nsis\*-setup.exe', 'target\release\bundle\msi\*.msi' -ErrorAction SilentlyContinue
          $sums = 'target\SHA256SUMS'
          if (Test-Path $sums) { Remove-Item $sums }
          foreach ($f in $files) {
            # SHA256SUMS-Sidecar (UC t_d323be7e): der Updater verifiziert jeden
            # Download gegen diese Prüfsumme — ohne lehnt er ab (kein
            # Trust-on-Download ohne Check).
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            Add-Content -Path $sums -Value "$hash  $($f.Name)"
            curl.exe -sS -X POST -H "Authorization: token $env:GITHUB_TOKEN" -F "attachment=@$($f.FullName)" "$api/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Asset-Upload fehlgeschlagen (uebersprungen): $($f.FullName)"
            } else {
              Write-Host "Release-Asset: $($f.FullName)"
            }
          }
          if ((Test-Path $sums) -and (Get-Item $sums).Length -gt 0) {
            curl.exe -sS -X POST -H "Authorization: token $env:GITHUB_TOKEN" -F "attachment=@$sums" "$api/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets" | Out-Null
            Write-Host "Release-Asset: SHA256SUMS"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------
  # mirror-public (S5): öffentliches GitHub-Repo als Release-Heimat.
  # Läuft NUR wenn BEIDE Build-Jobs success sind (needs-Kette) und pusht
  # ausschließlich main + v*-Tags (keine Feature-Branches). Token kommt
  # ausschließlich aus dem Gitea-Secret GITHUBMIRRORTOKEN — nie ins Repo.
  # --------------------------------------------------------------------
  mirror-public:
    name: Mirror → GitHub SeBoOne/architects-overlay (main + Tags)
    runs-on: ubuntu-latest
    needs: [linux, windows]

    steps:
      - name: Checkout (full history + Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: main + Tags nach GitHub spiegeln (force)
        run: |
          set -euo pipefail
          git remote add public "https://x-access-token:${GITHUBMIRRORTOKEN}@github.com/SeBoOne/architects-overlay.git"

          # main (force — Mirror ist Abbild der Dev-Quelle)
          git push --force public refs/heads/main:refs/heads/main

          # Tags: nur v*-Tags, einzeln gepusht (force)
          for tag in $(git tag -l 'v*'); do
            echo "Mirror-Tag: $tag"
            git push --force public "refs/tags/${tag}:refs/tags/${tag}"
          done

          # Stale-Cleanup: das öffentliche Repo ist Abbild der Dev-Quelle und
          # bekommt ausschließlich main + v*-Tags. Alles andere (Altlasten
          # aus früheren Mirrors) wird gelöscht — KEINE Feature-Branches.
          git ls-remote --heads public | cut -f2 | sed 's|refs/heads/||' \
            | while read -r branch; do
                [ "$branch" = "main" ] && continue
                echo "Loesche Stale-Branch: $branch"
                git push public --delete "refs/heads/$branch" || true
              done
          git ls-remote --tags public | cut -f2 | sed 's|refs/tags/||; s|\^{}$||' | sort -u \
            | while read -r tag; do
                case "$tag" in v*) continue ;; esac
                echo "Loesche Stale-Tag: $tag"
                git push public --delete "refs/tags/$tag" || true
              done
        env:
          GITHUBMIRRORTOKEN: ${{ secrets.GITHUBMIRRORTOKEN }}

      - name: GitHub-Release des neuesten v*-Tags befüllen (Assets aus der Gitea-Release)
        # Idempotent: läuft auch bei main-Pushes und backfillt so das Release
        # des neuesten Tags (Tag-Runs am Tag-Commit haben ggf. noch keine
        # mirror-public-Definition in ihrem Workflow-File).
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          GH_API="https://api.github.com/repos/SeBoOne/architects-overlay"
          GH_UP="https://uploads.github.com/repos/SeBoOne/architects-overlay"
          GH_AUTH="Authorization: Bearer ${GITHUBMIRRORTOKEN}"
          GT_API="${GITHUB_SERVER_URL}/api/v1"
          GT_AUTH="Authorization: token ${GITHUB_TOKEN}"
          TAG="$(git tag -l 'v*' | sort -V | tail -1)"
          echo "Neuester Tag: ${TAG}"

          # Release zum Tag suchen; fehlt es, anlegen (Tag wurde soeben gespiegelt).
          CODE="$(curl -sS -o /tmp/rel.json -w '%{http_code}' -H "$GH_AUTH" "$GH_API/releases/tags/${TAG}")"
          echo "GET releases/tags/${TAG} -> ${CODE} $(head -c 200 /tmp/rel.json)"
          ID="$(jq -r '.id // empty' /tmp/rel.json)"
          if [ -z "${ID}" ]; then
            CODE="$(curl -sS -o /tmp/newrel.json -w '%{http_code}' -X POST -H "$GH_AUTH" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/vnd.github+json' \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Architects Overlay ${TAG}\",\"body\":\"Release-Spiegel der Gitea-Dev-Release (Gitea = Dev-Quelle, GitHub = oeffentliche Release-Quelle).\"}" \
              "$GH_API/releases")"
            echo "POST releases -> ${CODE} $(head -c 300 /tmp/newrel.json)"
            ID="$(jq -r '.id // empty' /tmp/newrel.json)"
            [ -n "${ID}" ] || exit 1
          fi

          # Assets: von der Gitea-Release nehmen, fehlende auf GitHub hochladen
          # (idempotent — vorhandene Namen werden übersprungen).
          curl -fsS -H "$GT_AUTH" \
            "$GT_API/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r '.assets[] | "\(.name)\t\(.browser_download_url)"' \
            | while IFS=$'\t' read -r name url; do
                if curl -sS -H "$GH_AUTH" "$GH_API/releases/${ID}/assets" \
                   | jq -e -r --arg n "$name" '.[].name' | grep -qx "$name"; then
                  echo "Asset vorhanden (skip): $name"
                  continue
                fi
                curl -fsSL -H "$GT_AUTH" -o "/tmp/$name" "$url"
                curl -fsS -X POST -H "$GH_AUTH" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary "@/tmp/$name" \
                  "$GH_UP/releases/${ID}/assets?name=$name" | jq -r '.name'
                rm -f "/tmp/$name"
              done
        env:
          GITHUBMIRRORTOKEN: ${{ secrets.GITHUBMIRRORTOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
