# GitHub Actions — kanonische Build-Pipeline (GitHub ist die Release-Plattform).
#
# Trigger: nur Tags v*  →  Linux (deb/AppImage) + Windows (NSIS + MSI) werden
# gebaut und an das Release angehängt. Kein main-Push-Build (Code-Qualität
# läuft über die lokalen Gates der Builder; Public-Repo bleibt schlank).
#
# Runner: github-hosted (ubuntu-latest / windows-latest) — im Public-Repo
# ohne Minutenlimit. Die selfhosted Windows-VM ist für diesen Zweck
# ausgeschaltet (eingerichtet bleibt sie, siehe docs/CI-WINDOWS.md).
#
# Version: der Tag-Commit MUSS die richtige Version in Cargo.toml +
# tauri.conf.json tragen (Release-Tag-Skript: scripts/release.sh).

name: build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux (ubuntu-latest) — deb/AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 + pnpm (corepack)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tauri-Systemdeps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential curl wget file libxdo-dev

      - name: pnpm aktivieren
        run: corepack enable pnpm && corepack prepare pnpm@12.14.0 --activate && pnpm -v

      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile

      - name: Frontend bauen (vite → ./build)
        run: pnpm build

      - name: Rust-Build + Bundle
        run: pnpm tauri build

      - name: Release-Assets anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      # TG: SHA256-Manifest der Linux-Assets für den latest.json-Job.
      - name: SHA256-Manifest (Linux)
        run: |
          cd target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > sha256-linux.txt
          cat sha256-linux.txt

      - name: Manifest als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sha256-linux
          path: target/release/bundle/sha256-linux.txt

  windows:
    name: Windows (windows-latest) — NSIS/MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm aktivieren
        shell: bash
        run: corepack enable pnpm && corepack prepare pnpm@12.14.0 --activate && pnpm -v

      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Frontend bauen (vite → ./build)
        run: pnpm build
        shell: bash

      - name: Tauri-Bundle bauen (NSIS + MSI — hosted Runner hat MSVC + WiX)
        run: pnpm tauri build
        shell: bash

      - name: Release-Assets anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      # TG: SHA256-Manifest der Windows-Assets für den latest.json-Job.
      - name: SHA256-Manifest (Windows)
        shell: bash
        run: |
          cd target/release/bundle
          sha256sum nsis/*.exe msi/*.msi > sha256-windows.txt
          cat sha256-windows.txt

      - name: Manifest als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sha256-windows
          path: target/release/bundle/sha256-windows.txt

  # TG: latest.json — Update-Check-Index OHNE GitHub-API. Der Updater holt
  # diese Datei über den NICHT rate-limiteden Redirect-Pfad
  # `releases/latest/download/latest.json` statt `/releases/latest` (API:
  # 60 req/h pro IP — bricht für CGNAT/Uni-Netze).
  latest-json:
    name: latest.json (Update-Index)
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Manifests herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true
          path: manifests/

      - name: latest.json + SHA256SUMS bauen
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import json, os, glob
          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          repo = os.environ["REPO_URL"]
          lines = []
          assets = []
          for mf in sorted(glob.glob("manifests/sha256-*.txt")):
              for line in open(mf):
                  line = line.strip()
                  if not line:
                      continue
                  sha, path = line.split(None, 1)
                  name = os.path.basename(path.strip())
                  lines.append(f"{sha}  {name}")
                  assets.append({
                      "name": name,
                      "url": f"{repo}/releases/download/{tag}/{name}",
                      "sha256": sha,
                  })
          latest = {
              "tag": tag,
              "version": version,
              "released_at": os.environ.get("RELEASED_AT", ""),
              "assets": assets,
          }
          with open("latest.json", "w") as f:
              json.dump(latest, f, indent=2)
              f.write("\n")
          with open("SHA256SUMS", "w") as f:
              f.write("\n".join(lines) + "\n")
          print(open("latest.json").read())
          PY

      - name: latest.json + SHA256SUMS anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            SHA256SUMS
