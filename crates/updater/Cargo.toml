[package]
name = "updater"
version = "0.5.13"
edition = "2024"
rust-version = "1.90"
description = "SC Architects Overlay — Gitea-Release Update-Check + on-demand Update (Windows NSIS / Linux AppImage)"
license = "MIT"

[dependencies]
i18n-err = { path = "../i18n-err" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
