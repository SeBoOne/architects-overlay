[package]
name = "cache"
version = "0.1.0"
description = "SQLite cache for entities, prices and marketplace offers (rusqlite)"
edition = "2024"
rust-version = "1.90"

[dependencies]
provider = { path = "../provider" }
async-trait = "0.1"
# bundled: compiles SQLite from source — no system libsqlite3 required on any
# target (Tauri Linux/Windows bundles).
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
i18n-err = { path = "../i18n-err" }
tokio = { version = "1", features = ["rt", "time", "macros"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"
